<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>视频封面</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { display: flex; align-items: center; justify-content: center; min-height: 100vh; background: #111; font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", "Segoe UI", sans-serif; }

  /* 1280x720 封面画布 */
  .cover {
    position: relative;
    width: 1280px;
    height: 720px;
    overflow: hidden;
    background: radial-gradient(1200px 600px at 85% -10%, #3b1b8f 0%, rgba(59,27,143,0) 55%),
                radial-gradient(900px 500px at -5% 110%, #0e7490 0%, rgba(14,116,144,0) 50%),
                linear-gradient(135deg, #0b0d1e 0%, #131033 55%, #1a0f45 100%);
    color: #fff;
    padding: 64px 80px;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
  }

  /* 数学网格装饰（3B1B 风格） */
  .grid {
    position: absolute; inset: 0; pointer-events: none;
    background-image: linear-gradient(rgba(255,255,255,0.045) 1px, transparent 1px),
                      linear-gradient(90deg, rgba(255,255,255,0.045) 1px, transparent 1px);
    background-size: 64px 64px;
    -webkit-mask-image: radial-gradient(ellipse at 70% 30%, #000 30%, transparent 75%);
            mask-image: radial-gradient(ellipse at 70% 30%, #000 30%, transparent 75%);
  }

  /* 函数曲线装饰（数学主题） */
  .curve {
    position: absolute; right: -60px; bottom: -80px; width: 620px; height: 380px; opacity: 0.35;
  }
  .curve svg { width: 100%; height: 100%; }

  /* 顶部标签 */
  .topbar { display: flex; align-items: center; justify-content: space-between; position: relative; z-index: 2; }
  .badge {
    display: inline-flex; align-items: center; gap: 12px;
    background: rgba(255,255,255,0.08);
    border: 1px solid rgba(255,255,255,0.22);
    border-radius: 999px;
    padding: 10px 24px;
    font-size: 22px; font-weight: 700; letter-spacing: 1px;
  }
  .badge .dot { width: 12px; height: 12px; border-radius: 50%; background: #ff6b35; box-shadow: 0 0 12px #ff6b35; }
  .live-tag {
    background: linear-gradient(90deg, #ff8a00, #ff4f00);
    border-radius: 8px; padding: 10px 22px;
    font-size: 20px; font-weight: 700; letter-spacing: 2px;
    box-shadow: 0 4px 24px rgba(255,79,0,0.45);
  }

  /* 中部标题 */
  .main { position: relative; z-index: 2; }
  .kicker { font-size: 30px; font-weight: 500; color: #c4b5fd; letter-spacing: 3px; margin-bottom: 18px; }
  h1 {
    font-size: 110px; line-height: 1.08; font-weight: 900; letter-spacing: 2px;
    text-shadow: 0 8px 40px rgba(0,0,0,0.45);
  }
  h1 .hl { background: linear-gradient(90deg, #ff9a3d, #ff4f00 60%, #ff2d55); -webkit-background-clip: text; background-clip: text; color: transparent; }
  .sub { margin-top: 26px; font-size: 38px; font-weight: 600; color: #e5e7eb; display: flex; align-items: center; gap: 18px; }
  .sub .line { width: 64px; height: 6px; border-radius: 3px; background: linear-gradient(90deg, #ff8a00, #ff4f00); }

  /* 底部信息条 */
  .footer { display: flex; align-items: center; justify-content: space-between; position: relative; z-index: 2; }
  .meta { font-size: 26px; color: #9ca3af; font-weight: 500; }
  .meta strong { color: #fff; font-weight: 700; }
  .dur { font-size: 24px; font-weight: 700; color: #fff; background: rgba(255,255,255,0.1); border: 1px solid rgba(255,255,255,0.25); border-radius: 8px; padding: 8px 20px; }
</style>
</head>
<body>
  <div class="cover">
    <div class="grid"></div>
    <div class="curve">
      <svg viewBox="0 0 620 380" fill="none">
        <path d="M0 300 C 80 120, 160 320, 240 220 S 400 60, 480 180 S 580 320, 620 160" stroke="#ff6b35" stroke-width="5" stroke-linecap="round"/>
        <path d="M0 340 C 100 200, 200 360, 300 280 S 460 120, 620 240" stroke="#8b5cf6" stroke-width="4" stroke-linecap="round" opacity="0.7"/>
      </svg>
    </div>

    <div class="topbar">
      <!-- ① 左上徽标：<嘉宾/人物> × <频道/来源> -->
      <div class="badge"><span class="dot"></span>嘉宾 × 频道</div>
      <!-- ② 右上场景词：实录 / 首发 / 对谈 / 深度拆解 -->
      <div class="live-tag">实录</div>
    </div>

    <div class="main">
      <!-- ③ kicker：最强卖点/场景引导（一行，30px，紫色小字） -->
      <div class="kicker">最强卖点一句话</div>
      <!-- ④ 主标题：观众关心的问题句式（悬念钩子，2 行以内大字，可用 .hl 高亮关键词）
           例：什么时候该从提示词走向自训模型？/ 为什么便宜 80% 还是没人用？ -->
      <h1>观众关心的<span class="hl">问题</span>？<br>第二行补充</h1>
      <!-- ⑤ 副标题：一句话内容定位，交代视频讲什么（主题路径/覆盖范围） -->
      <div class="sub"><span class="line"></span>主题路径或覆盖范围一句话</div>
    </div>

    <div class="footer">
      <!-- ⑥ 来源说明：谁 + 在哪 + 干什么 -->
      <div class="meta"><strong>嘉宾名字</strong> 走进/做客 <strong>频道名</strong> · 主题副信息</div>
      <!-- ⑦ 时长 -->
      <div class="dur">00:00</div>
    </div>
  </div>
</body>
</html>
